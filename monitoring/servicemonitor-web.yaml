# web 业务的 ServiceMonitor：让 Prometheus 抓到 Flask 的 /metrics
#
# 为什么需要它：04 号演练（MySQL 不可用）发现「应用 5xx 比例过高」这条规则
# 从来就没有数据 —— Prometheus 里根本不存在 http_requests_total，
# 因为业务 Pod 从来没有被采集过，规则一直靠 noDataState=OK "装正常"。
#
# 部署：
#   kubectl apply -f servicemonitor-web.yaml
# 验证：
#   curl -s 'http://<prometheus>/api/v1/query?query=http_requests_total' | jq
#
# 注意：ServiceMonitor 必须带 label release=kube-prom，且位于 monitoring 命名空间
#      （Prometheus CR 的 serviceMonitorSelector 是 release=kube-prom）。

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: web
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  # Service 在 demo 命名空间，需要显式指定
  namespaceSelector:
    matchNames:
      - demo
  selector:
    matchLabels:
      app: web
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
